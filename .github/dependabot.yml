version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Rune is pinned to one git revision on purpose; update it by hand (docs/development.md).
    ignore:
      - dependency-name: rune
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
