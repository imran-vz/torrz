name: Feature request
description: Suggest something Torrz could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or problem, not just the feature. What gets in your way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work, in the window and as a `torrz` command. Every control in Torrz has both.
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: Other clients that do it well, screenshots, alternatives you've considered.
