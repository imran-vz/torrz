<!doctype html>
<!-- The link preview card (site/public/og.png), 1200×630. Render it with site/og/render.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Torrz link preview</title>
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: #0f0f11;
    color: #ececef;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* The icon's dither, fading out towards the screenshot. */
  .dither {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgb(255 255 255 / 0.085) 1.3px, transparent 1.6px);
    background-size: 12px 12px;
    mask-image: radial-gradient(ellipse 80% 90% at 20% 45%, #000 25%, transparent 78%);
  }
  /* A soft wash of the app's blue behind the window. */
  .glow {
    position: absolute;
    width: 760px;
    height: 760px;
    right: -260px;
    top: -120px;
    background: radial-gradient(circle, rgb(76 155 255 / 0.22), transparent 62%);
  }
  .copy {
    position: absolute;
    left: 72px;
    top: 64px;
    width: 560px;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 64px; height: 64px; }
  .brand span { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
  h1 {
    margin: 46px 0 0;
    font-size: 66px;
    line-height: 1.02;
    letter-spacing: -0.045em;
    font-weight: 760;
  }
  h1 em { font-style: normal; color: #4c9bff; }
  p {
    margin: 22px 0 0;
    font-size: 25px;
    line-height: 1.4;
    color: #a4a4ad;
    letter-spacing: -0.005em;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
  .chips code {
    padding: 8px 14px;
    border-radius: 9px;
    background: rgb(76 155 255 / 0.13);
    border: 1px solid rgb(76 155 255 / 0.25);
    color: #8ec2ff;
    font: 500 19px ui-monospace, "SF Mono", Menlo, monospace;
  }
  .url {
    position: absolute;
    left: 72px;
    bottom: 54px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    color: #8f8f97;
    letter-spacing: 0.01em;
  }
  .url i { width: 9px; height: 9px; border-radius: 50%; background: #3ecf7a; }
  /* The window, bleeding off the right edge. */
  .window {
    position: absolute;
    left: 676px;
    top: 92px;
    width: 980px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgb(255 255 255 / 0.12);
    box-shadow: 0 40px 90px -20px rgb(0 0 0 / 0.85), 0 0 0 1px rgb(0 0 0 / 0.6);
  }
  .window img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="dither"></div>
  <div class="window"><img src="../public/screens/selected.webp" alt=""></div>
  <div class="copy">
    <div class="brand"><img src="../public/icon.svg" alt=""><span>Torrz</span></div>
    <h1>Every click is <em>a&nbsp;command</em>.</h1>
    <p>An open-source BitTorrent client for macOS, with a command for every button.</p>
    <div class="chips"><code>torrz pause selected</code><code>torrz ui tab peers</code></div>
  </div>
  <div class="url"><i></i>torrz.imran.codes</div>
</body>
</html>
