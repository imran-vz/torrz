<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torrz — UI directions</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.gallery{max-width:1080px;margin:0 auto;font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif);color:var(--foreground,#161616)}
.opt{margin:0 0 34px}
.cap{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.cap b{font-size:15px;font-weight:650;letter-spacing:-.01em}
.cap .n{font:600 11px/1 var(--font-mono,ui-monospace,"SF Mono",Menlo,monospace);opacity:.55}
.cap span{font-size:12.5px;color:var(--muted-foreground,#6a6a6a)}
.stage{width:100%;position:relative;overflow:hidden;border-radius:10px}
.win{width:1080px;height:680px;transform-origin:0 0;position:relative;overflow:hidden;border-radius:11px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;font-size:12px;line-height:1.3;-webkit-font-smoothing:antialiased;cursor:default;user-select:none}
.win svg{display:block;flex:none}
.tl{display:flex;gap:8px;align-items:center}
.tl i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.tl i:nth-child(2){background:#febc2e}.tl i:nth-child(3){background:#28c840}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ───────── 1 · Graphite ───────── */
.m1{background:#19191b;color:#e6e6e8;display:grid;grid-template-columns:196px 1fr;border:1px solid #000}
.m1 .side{background:linear-gradient(180deg,#2a2a2e,#242427);border-right:1px solid #0b0b0c;padding:14px 10px 10px;display:flex;flex-direction:column}
.m1 .side .tl{margin:1px 0 20px 4px}
.m1 .side h6{font-size:10.5px;font-weight:600;color:#85858c;margin:12px 8px 4px;letter-spacing:.02em}
.m1 .side a{display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;border-radius:6px;color:#dcdce0;font-size:12.5px}
.m1 .side a svg{color:#4c9bff}
.m1 .side a em{margin-left:auto;font-style:normal;color:#7d7d84;font-size:11px}
.m1 .side a.on{background:#3b3b41}
.m1 .side .dot{width:8px;height:8px;border-radius:50%;margin:0 3px}
.m1 .alt{margin-top:auto;border-top:1px solid #38383d;padding:10px 8px 2px;display:flex;align-items:center;gap:8px;color:#a5a5ac;font-size:11.5px}
.m1 .sw{margin-left:auto;width:28px;height:16px;border-radius:8px;background:#55555c;position:relative}
.m1 .sw:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#e8e8ea}
.m1 .main{display:grid;grid-template-rows:48px 24px 1fr 244px 24px;min-width:0}
.m1 .tb{display:flex;align-items:center;gap:6px;padding:0 12px 0 16px;border-bottom:1px solid #0d0d0e;background:#222225}
.m1 .tb h1{font-size:13.5px;font-weight:650;margin-right:2px}
.m1 .tb small{color:#7f7f86;font-size:11.5px;margin-right:auto}
.m1 .btn{width:30px;height:26px;border-radius:6px;display:grid;place-items:center;color:#c9c9ce}
.m1 .btn.h{background:#333338}
.m1 .sep{width:1px;height:18px;background:#3a3a3f;margin:0 4px}
.m1 .search{width:190px;height:26px;border-radius:7px;background:#16161a;border:1px solid #3a3a40;display:flex;align-items:center;gap:6px;padding:0 8px;color:#75757c;font-size:12px;margin-left:8px}
.m1 .row,.m1 .hd{display:grid;grid-template-columns:1fr 52px 116px 80px 68px 64px 52px 36px 50px;align-items:center;padding:0 14px 0 16px;gap:9px}
.m1 .hd{font-size:10.5px;color:#8b8b92;font-weight:600;border-bottom:1px solid #2c2c30;background:#1d1d20}
.m1 .hd span:nth-child(n+2),.m1 .row>span:nth-child(n+2){text-align:right}
.m1 .hd span:nth-child(3),.m1 .hd span:nth-child(4),.m1 .row>span:nth-child(4){text-align:left}
.m1 .rows{overflow:hidden}
.m1 .row{height:28px;font-size:12px;color:#c8c8cd}
.m1 .row:nth-child(even){background:#1e1e21}
.m1 .row .nm{color:#ececef;display:flex;gap:8px;align-items:center;min-width:0}
.m1 .row.sel{background:#1f5fd0!important;color:#fff}
.m1 .row.sel .st,.m1 .row.sel .nm{color:#fff}
.m1 .pg{display:flex;align-items:center;gap:8px}
.m1 .pg i{flex:1;height:4px;border-radius:2px;background:#37373c;overflow:hidden}
.m1 .row.sel .pg i{background:rgba(255,255,255,.28)}
.m1 .pg b{display:block;height:100%;background:#4c9bff;border-radius:2px}
.m1 .row.sel .pg b{background:#fff}
.m1 .pg b.seed,.m1 .pg b.done{background:#3ecf7a}.m1 .pg b.pause,.m1 .pg b.queue{background:#77777e}.m1 .pg b.check{background:#f0b23e}
.m1 .pg u{text-decoration:none;width:30px;text-align:right}
.m1 .st.down{color:#6aaeff}.m1 .st.seed{color:#4fd48a}.m1 .st.check{color:#f0b23e}.m1 .st.pause,.m1 .st.queue,.m1 .st.done{color:#8f8f96}
.m1 .insp{border-top:1px solid #000;background:#202023;display:grid;grid-template-rows:34px 1fr;min-height:0}
.m1 .tabs{display:flex;align-items:center;gap:2px;padding:0 14px;border-bottom:1px solid #2e2e32}
.m1 .tabs b{font-weight:500;font-size:11.5px;color:#9a9aa1;padding:4px 10px;border-radius:5px}
.m1 .tabs b.on{background:#3a3a40;color:#fff}
.m1 .tabs span{margin-left:auto;color:#77777e;font-size:11px}
.m1 .ib{display:grid;grid-template-columns:1fr 330px;gap:22px;padding:14px 16px;min-height:0}
.m1 .ib h2{font-size:13px;font-weight:600;margin-bottom:8px}
.m1 .pieces{display:flex;height:14px;border-radius:3px;overflow:hidden;background:#333338;margin-bottom:4px}
.m1 .pieces i{flex:1}
.m1 .pl{display:flex;justify-content:space-between;color:#85858c;font-size:10.5px;margin-bottom:12px}
.m1 .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 18px}
.m1 .kv div{display:flex;justify-content:space-between;border-bottom:1px solid #2d2d31;padding-bottom:5px;font-size:11.5px}
.m1 .kv span{color:#8a8a91}
.m1 .graph{background:#19191b;border:1px solid #303035;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column}
.m1 .graph p{display:flex;gap:14px;font-size:11px;color:#9a9aa1;margin-bottom:6px}
.m1 .graph p b{color:#6aaeff;font-weight:600}.m1 .graph p b+b{color:#4fd48a}
.m1 .sb{display:flex;align-items:center;gap:16px;padding:0 14px;background:#222225;border-top:1px solid #0d0d0e;font-size:11px;color:#9b9ba2}
.m1 .sb b{color:#dedee2;font-weight:500}
.m1 .sb .ok{width:7px;height:7px;border-radius:50%;background:#3ecf7a;display:inline-block;margin-right:5px}

/* ───────── 2 · Paper ───────── */
.m2{background:#f5f2eb;color:#1d1b17;display:grid;grid-template-columns:178px 1fr 296px;border:1px solid #cfc9bc}
.m2 .side{background:#ebe7dd;border-right:1px solid #d9d3c6;padding:14px 10px;display:flex;flex-direction:column}
.m2 .side .tl{margin:1px 0 22px 4px}
.m2 .side h6{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#958d7e;font-weight:600;margin:14px 8px 5px}
.m2 .side a{display:flex;align-items:center;height:27px;padding:0 8px;border-radius:6px;font-size:12.5px;color:#3a362f}
.m2 .side a em{margin-left:auto;font-style:normal;color:#9a9283;font-size:11px}
.m2 .side a.on{background:#1d1b17;color:#f5f2eb}.m2 .side a.on em{color:#b9b2a3}
.m2 .quota{margin-top:auto;padding:10px 8px 2px;border-top:1px solid #d6cfc1;font-size:11px;color:#7d7566}
.m2 .quota i{display:block;height:3px;background:#d6cfc1;border-radius:2px;margin:6px 0 5px}
.m2 .quota i b{display:block;width:62%;height:100%;background:#1d1b17;border-radius:2px}
.m2 .main{display:grid;grid-template-rows:56px 1fr;min-width:0;border-right:1px solid #ddd7ca}
.m2 .tb{display:flex;align-items:center;padding:0 18px;gap:8px;border-bottom:1px solid #ddd7ca}
.m2 .tb h1{font:600 20px/1 "New York",ui-serif,Georgia,serif;letter-spacing:-.01em;margin-right:auto}
.m2 .tb .sp{font-size:11.5px;color:#7d7566;margin-right:10px}
.m2 .tb .sp b{font:600 15px/1 "New York",ui-serif,Georgia,serif;color:#1d1b17;margin-right:3px}
.m2 .ib{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#4a453c;border:1px solid #d3ccbe;background:#faf8f3}
.m2 .add{height:28px;padding:0 12px;border-radius:7px;background:#d6452a;color:#fff;font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px}
.m2 .list{overflow:hidden}
.m2 .it{display:grid;grid-template-columns:26px 1fr 150px 84px;gap:12px;align-items:center;height:52px;padding:0 18px;border-bottom:1px solid #e6e0d4}
.m2 .it.sel{background:#fffdf8;box-shadow:inset 3px 0 0 #d6452a}
.m2 .it .t{min-width:0}
.m2 .it .t b{display:block;font-weight:600;font-size:12.5px}
.m2 .it .t small{font-size:11px;color:#8a8273}
.m2 .it .bar{height:3px;background:#ddd6c8;border-radius:2px}
.m2 .it .bar b{display:block;height:100%;border-radius:2px;background:#1d1b17}
.m2 .it .bar b.down{background:#d6452a}.m2 .it .bar b.pause,.m2 .it .bar b.queue{background:#b3ab9b}.m2 .it .bar b.check{background:#b98a1c}
.m2 .it .v{text-align:right;font-size:11.5px;color:#5a5449}
.m2 .it .v small{display:block;color:#9a9283;font-size:10.5px}
.m2 .ring{width:22px;height:22px}
.m2 .insp{background:#faf8f3;padding:18px 18px 0;overflow:hidden}
.m2 .insp .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#958d7e;font-weight:600}
.m2 .insp h2{font:600 16px/1.25 "New York",ui-serif,Georgia,serif;margin:6px 0 4px;overflow-wrap:anywhere}
.m2 .insp p{font-size:11.5px;color:#6f6759}
.m2 .big{display:flex;align-items:baseline;gap:8px;margin:16px 0 6px}
.m2 .big b{font:500 44px/1 "New York",ui-serif,Georgia,serif;letter-spacing:-.02em}
.m2 .big span{font-size:11.5px;color:#6f6759}
.m2 .pm{display:flex;gap:1px;height:18px;margin-bottom:14px}
.m2 .pm i{flex:1;background:#e2dccf}.m2 .pm i.f{background:#1d1b17}.m2 .pm i.a{background:#d6452a}
.m2 .seg{display:flex;border-bottom:1px solid #ddd7ca;margin:0 -18px 8px;padding:0 18px;gap:16px;font-size:11.5px;color:#8a8273}
.m2 .seg b{padding:7px 0;font-weight:500}.m2 .seg b.on{color:#1d1b17;font-weight:600;box-shadow:inset 0 -2px 0 #d6452a}
.m2 .f{display:flex;align-items:center;gap:8px;height:27px;font-size:11.5px}
.m2 .f .cb{width:13px;height:13px;border-radius:3.5px;background:#1d1b17;color:#fff;display:grid;place-items:center}
.m2 .f .cb.off{background:none;border:1.2px solid #b3ab9b}
.m2 .f em{margin-left:auto;font-style:normal;color:#8a8273}
.m2 .f .pr{font-size:10px;border:1px solid #d3ccbe;border-radius:4px;padding:1px 5px;color:#6f6759}
.m2 .dkv{display:grid;grid-template-columns:86px 1fr;gap:6px 8px;font-size:11.5px;margin-top:12px;padding-top:12px;border-top:1px solid #e3ddd0}
.m2 .dkv span{color:#8a8273}

/* ───────── 3 · Console ───────── */
.m3{background:#0b0c0a;color:#cfcbbd;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;display:grid;grid-template-rows:34px 1fr 152px;border:1px solid #2a2a24}
.m3 .top{display:flex;align-items:center;gap:14px;padding:0 12px;border-bottom:1px solid #24251f;background:#11120f}
.m3 .top .ttl{color:#8c8a7c}.m3 .top .ttl b{color:#ffb000;font-weight:600}
.m3 .top .r{margin-left:auto;display:flex;gap:16px}
.m3 .am{color:#ffb000}.m3 .gr{color:#8fd16a}.m3 .dm{color:#6d6b5f}.m3 .rd{color:#ff6b57}.m3 .bl{color:#6cc3e0}
.m3 .mid{display:grid;grid-template-columns:168px 1fr;min-height:0}.m3 .ctr{display:grid;grid-template-rows:auto 1fr;min-width:0}.m3 .det3{border-top:1px solid #24251f;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:22px;padding:10px 12px;min-height:0;overflow:hidden}
.m3 .pane{border-right:1px solid #24251f;padding:10px 12px;overflow:hidden}
.m3 .pane:last-child{border:0}
.m3 h6{font-size:10px;color:#6d6b5f;font-weight:500;letter-spacing:.08em;margin:0 0 6px}
.m3 .fl{display:flex;height:20px;align-items:center;gap:6px}
.m3 .fl em{margin-left:auto;font-style:normal;color:#6d6b5f}
.m3 .fl.on{background:#ffb000;color:#0b0c0a;margin:0 -6px;padding:0 6px}.m3 .fl.on em{color:#5a3e00}
.m3 .tr,.m3 .th{display:grid;grid-template-columns:22px 1fr 124px 40px 84px 84px 70px 50px 60px;gap:10px;height:22px;align-items:center;white-space:nowrap}
.m3 .th{color:#6d6b5f;font-size:10px;letter-spacing:.06em;border-bottom:1px solid #24251f;margin-bottom:3px}
.m3 .tr span:nth-child(n+4),.m3 .th span:nth-child(n+4){text-align:right}
.m3 .tr.on{background:#1e1f19;box-shadow:inset 2px 0 0 #ffb000;margin:0 -12px;padding:0 12px}
.m3 .tr .b{letter-spacing:-.5px}
.m3 .kv2{display:grid;grid-template-columns:74px 1fr;gap:3px 6px}
.m3 .kv2 span{color:#6d6b5f}
.m3 .pc{display:grid;grid-template-columns:repeat(50,1fr);gap:1px;margin:4px 0 8px}
.m3 .pc i{height:9px;background:#24251f}.m3 .pc i.f{background:#8fd16a}.m3 .pc i.a{background:#ffb000}
.m3 .bot{border-top:1px solid #24251f;background:#0e0f0c;display:grid;grid-template-rows:1fr 30px 24px}
.m3 .log{padding:8px 12px 0;line-height:18px;overflow:hidden}
.m3 .prompt{display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid #24251f;background:#14150f;font-size:12px}
.m3 .prompt .cur{width:7px;height:14px;background:#ffb000}
.m3 .prompt .hint{margin-left:auto;color:#6d6b5f;font-size:10.5px}
.m3 .keys{display:flex;gap:16px;align-items:center;padding:0 12px;color:#6d6b5f;font-size:10.5px;border-top:1px solid #24251f}
.m3 .keys b{color:#0b0c0a;background:#8c8a7c;padding:0 4px;border-radius:2px;font-weight:600;margin-right:5px}

/* ───────── 4 · Swarm ───────── */
.m4{background:#0c0d16;color:#e7e8f4;display:grid;grid-template-rows:46px 1fr;border:1px solid #23253a}
.m4 .tb{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #1d1f33;background:#10111d}
.m4 .tb h1{font-size:13px;font-weight:650;letter-spacing:.01em;margin-left:10px}
.m4 .pill{display:flex;background:#191b2c;border-radius:8px;padding:2px;margin-left:14px}
.m4 .pill b{font-weight:500;font-size:11.5px;color:#8f92ad;padding:4px 11px;border-radius:6px}
.m4 .pill b.on{background:#2a2d48;color:#fff}
.m4 .tb .r{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:11.5px;color:#9a9db8}
.m4 .cy{color:#4fd8ff}.m4 .pk{color:#ff7ac3}
.m4 .cta{height:28px;padding:0 12px;border-radius:8px;background:linear-gradient(135deg,#4fd8ff,#8b7bff);color:#0a0b14;font-weight:650;display:flex;align-items:center;gap:6px;font-size:12px}
.m4 .body{display:grid;grid-template-columns:292px 1fr;min-height:0}
.m4 .list{border-right:1px solid #1d1f33;padding:10px;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.m4 .c{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;height:58px;flex:none}
.m4 .c.on{background:#171930;box-shadow:inset 0 0 0 1px #33376a}
.m4 .c b{display:block;font-size:12px;font-weight:600}
.m4 .c small{font-size:10.5px;color:#8386a3}
.m4 .det{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;overflow:hidden}
.m4 .hdr{display:flex;align-items:center;gap:10px}
.m4 .hdr h2{font-size:17px;font-weight:650;letter-spacing:-.01em}
.m4 .hdr p{font-size:11.5px;color:#8386a3;margin-top:3px}
.m4 .hdr .acts{margin-left:auto;display:flex;gap:6px}
.m4 .ab{width:30px;height:30px;border-radius:8px;background:#171930;border:1px solid #262a4a;display:grid;place-items:center;color:#c3c6e0}
.m4 .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.m4 .tile{background:#12142340;border:1px solid #1f2238;border-radius:10px;padding:10px 12px}
.m4 .tile span{font-size:10.5px;color:#8386a3}
.m4 .tile b{display:block;font-size:19px;font-weight:650;letter-spacing:-.02em;margin-top:3px}
.m4 .tile b small{font-size:11px;font-weight:500;color:#8386a3;margin-left:3px}
.m4 .card{background:#10121f;border:1px solid #1f2238;border-radius:10px;padding:10px 12px}
.m4 .card h6{font-size:10.5px;font-weight:600;color:#8386a3;letter-spacing:.06em;text-transform:uppercase;display:flex;margin-bottom:8px}
.m4 .card h6 em{margin-left:auto;font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
.m4 .map{display:grid;grid-template-columns:repeat(74,1fr);gap:2px}
.m4 .map i{aspect-ratio:1;border-radius:1.5px;background:#1b1e33}
.m4 .map i.f{background:#4fd8ff}.m4 .map i.g{background:#3a8fd0}.m4 .map i.a{background:#fff;box-shadow:0 0 6px #8b7bff}
.m4 .pr,.m4 .ph{display:grid;grid-template-columns:150px 1fr 60px 80px 80px 90px;gap:10px;height:22px;align-items:center;font-size:11.5px}
.m4 .ph{color:#6d7090;font-size:10.5px}
.m4 .pr span:nth-child(n+3),.m4 .ph span:nth-child(n+3){text-align:right}
.m4 .pr .cl{color:#a7aac6}

/* ───────── 5 · Pocket ───────── */
.m5{background:radial-gradient(900px 500px at 12% 18%,#f2a65a 0%,transparent 60%),radial-gradient(800px 600px at 92% 30%,#5b6cf0 0%,transparent 62%),radial-gradient(900px 600px at 55% 110%,#17a398 0%,transparent 60%),#2a2140;color:#1c1c1e;border-radius:11px}
.m5 .menubar{height:24px;background:rgba(255,255,255,.2);backdrop-filter:blur(20px);display:flex;align-items:center;gap:16px;padding:0 14px;color:#fff;font-size:12px;font-weight:500}
.m5 .menubar b{font-weight:700}
.m5 .menubar .r{margin-left:auto;display:flex;gap:14px;align-items:center}
.m5 .tray{background:rgba(255,255,255,.28);border-radius:4px;padding:1px 7px;display:flex;gap:7px;align-items:center}
.m5 .w{position:absolute;border-radius:12px;background:rgba(248,248,250,.86);backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 24px 60px rgba(10,5,30,.45);overflow:hidden}
.m5 .mini{left:96px;top:56px;width:372px;height:590px;display:grid;grid-template-rows:44px 38px 1fr 40px}
.m5 .mh{display:flex;align-items:center;padding:0 12px;gap:10px}
.m5 .mh b{font-size:13px;font-weight:650;margin:0 auto}
.m5 .mh .p{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#48484d}
.m5 .sg{margin:0 12px;height:26px;background:rgba(0,0,0,.07);border-radius:7px;display:grid;grid-template-columns:repeat(4,1fr);padding:2px;font-size:11.5px;text-align:center;color:#55555a}
.m5 .sg b{font-weight:500;border-radius:5.5px;line-height:22px}
.m5 .sg b.on{background:#fff;color:#1c1c1e;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.m5 .ml{padding:4px 6px;overflow:hidden}
.m5 .mi{display:grid;grid-template-columns:1fr 26px;gap:8px;align-items:center;padding:8px;border-radius:8px}
